name: gg_one_core
description: "Kernel, checks and publish configuration of the gg_one tool family - state caching, command bases, verification steps and gg-publish.json handling."
version: 2.4.2
repository: https://github.com/ggsuite/gg_one_core.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.1
  gg_console_colors: ^2.3.1
  gg_direct_json: ^2.0.2
  gg_git: ^4.1.2
  gg_is_flutter: ^2.0.1
  gg_is_github: ^1.0.7
  gg_json: ^4.0.1
  gg_lang: ^0.5.1
  gg_log: ^1.0.7
  gg_process: ^1.1.7
  gg_publish: ^4.3.3
  gg_status_printer: ^1.4.3
  gg_test: ^3.1.1
  gg_version: ^5.2.2
  interact: ^2.2.0
  matcher: ^0.12.20
  meta: ^1.19.0
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

dev_dependencies:
  gg_capture_print: ^1.0.10
  lints: ^6.1.0
  test: ^1.31.2