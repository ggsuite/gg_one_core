name: gg_one_core
description: "Kernel, checks and publish configuration of the gg_one tool family - state caching, command bases, verification steps and gg-publish.json handling."
version: 2.6.0
repository: https://github.com/ggsuite/gg_one_core.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_console_colors: ^2.4.0
  gg_direct_json: ^2.1.0
  gg_git: ^4.3.0
  gg_is_flutter: ^2.2.0
  gg_is_github: ^1.1.0
  gg_json: ^4.2.0
  gg_lang: ^0.6.1
  gg_log: ^1.2.0
  gg_process: ^1.2.0
  gg_publish: ^4.5.0
  gg_status_printer: ^1.6.0
  gg_test: ^3.3.0
  gg_version: ^5.4.0
  interact: ^2.2.0
  matcher: ^0.12.20
  meta: ^1.19.0
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4

dev_dependencies:
  dna_ggsuite: ^0.2.0
  gg_capture_print: ^1.1.0
  helix: ^1.3.0
  lints: ^6.1.0
  test: ^1.31.2